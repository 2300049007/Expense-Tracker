<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense - FinTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="edit-expense-container">

        <h2>Edit Expense</h2>

        <p>Update the details of your expense below.</p>

        <form method="POST">

            <label>Expense Title</label>
            <input
                type="text"
                name="title"
                value="{{ expense['title'] }}"
                required
            >

            <label>Amount (₹)</label>
            <input
                type="number"
                name="amount"
                step="0.01"
                min="0.01"
                value="{{ expense['amount'] }}"
                required
            >

            <label>Category</label>
            <select name="category" required>
                {% for category in ["Food", "Travel", "Shopping", "Bills", "Education", "Other"] %}
                    <option
                        value="{{ category }}"
                        {% if expense['category'] == category %}selected{% endif %}
                    >
                        {{ category }}
                    </option>
                {% endfor %}
            </select>

            <label>Date</label>
            <input
                type="date"
                name="date"
                value="{{ expense['date'] }}"
                required
            >

            <button type="submit">Save Changes</button>

            <a href="{{ url_for('main.home') }}" class="cancel-edit">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
